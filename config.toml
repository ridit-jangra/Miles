[llm]
provider = "openrouter"
model = "anthropic/claude-haiku-5.5"

[agents]
provider = "openrouter"
model = "anthropic/claude-sonnet-5-5"

[context]
provider = "openrouter"
model = "anthropic/claude-haiku-5.5"
max_words = 250
max_chars = 8000

[stt]
provider = "whisper"
model = "small"
device = "cpu"
compute_type = "int8"

[tts]
provider = "piper"
voice = "en_US-danny-low"

[plugins]
enabled = true
disabled = []

[plugin_settings.web]
searxng_url = ""

[memory]
enabled = true
auto_remember = true      # Miles may save facts on his own; "remember that..." always works
history_days = "never"         # a number of days, or "never"
max_prompt_chars = 2000
